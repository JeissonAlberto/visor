[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visor"
version = "5.2.1"
description = "Visor Command Center — Jasol Group NOC Suite"
authors = [{name = "Ing. Jeisson Alberto Sarmiento"}]
requires-python = ">=3.10"
# Visor funciona con la biblioteca estándar de Python.
# El instalador usa --no-deps para evitar configuraciones adicionales.
dependencies = []

[project.scripts]
visor = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["config", "core", "ui", "utils"]
